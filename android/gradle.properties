org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseG1GC
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
# Build cache off since #51. The KSP/Hilt flakes it was meant to stop (MissingBinding
# StepsRepository on main @ f8b4e60; "could not be resolved" on #48, #51) turned out to be
# KSP 2.3.13 itself (google/ksp#3286, see libs.versions.toml), not the cache. Kept off for now:
# entries written by 2.3.13 may hold incomplete KSP output.
org.gradle.caching=false
android.useAndroidX=true
kotlin.code.style=official
