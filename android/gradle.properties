org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseG1GC
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# KSP incremental processing left Hilt's aggregated deps out of a cached KSP output
# (MissingBinding for StepsRepository on main @ f8b4e60, then KSP "could not be resolved"
# on #48). Full KSP runs are slower but deterministic, and the new input keys retire the
# poisoned build-cache entries.
ksp.incremental=false
