# hot-edge — thin Worker (A14 §5). No secrets in this file: they are set from GitHub Secrets by
# .github/workflows/backend.yml (wrangler secret put) or by hand with `wrangler secret put`.
name = "hot-edge"
main = "src/index.ts"
compatibility_date = "2026-10-15"
workers_dev = true

# Workers AI (Whisper STT, slice 5b). Free tier; no id needed.
[ai]
binding = "AI"

# Durable Object WhoopVault: the single owner of each user's WHOOP refresh token, sealed with
# AES-256-GCM under TOKEN_ENC_KEY (D-025, A18 И1.1a). SQLite-backed storage.
[[durable_objects.bindings]]
name = "WHOOP_VAULT"
class_name = "WhoopVault"

[[migrations]]
tag = "v1-whoop-vault"
new_sqlite_classes = ["WhoopVault"]

# Durable Object MentorMeter: the money meter of Винс per user — sums of USD per day and month,
# nothing else (A62 §2 «Лимиты», D-056: soft $0.40 / hard $1.50 a day, $10 a month).
[[durable_objects.bindings]]
name = "MENTOR_METER"
class_name = "MentorMeter"

[[migrations]]
tag = "v2-mentor-meter"
new_sqlite_classes = ["MentorMeter"]

# Rate limit for the unauthenticated OAuth routes (/whoop/authorize, /whoop/token): 20 per
# minute per IP. namespace_id is any account-unique integer string.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1101"
simple = { limit = 20, period = 60 }

# KV: only FCM tokens and rate-limit counters (A14 §5, slice 3). Create once, then uncomment:
#   npx wrangler kv namespace create HOT_KV
# [[kv_namespaces]]
# binding = "HOT_KV"
# id = "<id printed by the command above>"

# Non-secret configuration (A14 §5). DAILY_TOKEN_CAP is a placeholder [Оценка], tuned in slice 5a.
[vars]
LLM_MODELS = "claude-opus-5-5,claude-sonnet-5-5,claude-haiku-5-5"
DAILY_TOKEN_CAP = "2000000"
FCM_PROJECT_ID = ""
WHOOP_REDIRECT_URI = "com.healthofatitan.app://oauth/whoop"

# Secrets (names only, values never here):
#   WHOOP_CLIENT_ID, WHOOP_CLIENT_SECRET, ALLOWED_WHOOP_USER_IDS, TOKEN_ENC_KEY,
#   ANTHROPIC_API_KEY, GOOGLE_TTS_API_KEY, FCM_SERVICE_ACCOUNT_JSON
