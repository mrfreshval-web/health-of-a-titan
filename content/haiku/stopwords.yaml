  shame_and_pressure:       # Agent 10 / A11 §12.4: no shame, guilt, pressure, comparison
    - "стыд.*"
    - "позор.*"
    - "вин(а|у|ы|ой)"
    - "винова.*"
    - "слабак.*"
    - "слабост.*"
    - "лен(ь|и|ью)"
    - "ленив.*"
    - "лентя.*"
    - "провал.*"
    - "неудач.*"
    - "жалк.*"
    - "ничтожн.*"
