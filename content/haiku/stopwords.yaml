# Haiku stop dictionary ("не говорим"), see content/haiku/STYLE.md §6.
# Used by scripts/check_haiku.py for the library and for every generated haiku.
# Patterns are Python regexes over normalized text: lower case, "ё" → "е".
# Each pattern is wrapped in Russian word boundaries, so "вес" does not hit "весна".
# A pattern that ends with ".*" is a stem: "болезн.*" hits "болезнь", "болезни".
# errors  → the haiku is rejected.
# warnings → allowed, but a human (Agent 16, then 10/3) reads it before release.
# Medical words: changes only with review by Agent 3; shame/crisis words: Agent 10.
version: 1
reviewedBy: []
status: draft

errors:
  diagnosis_and_medicine:   # Agent 3: no diagnoses, symptoms, treatment, metrics
    - "диагноз.*"
    - "болезн.*"
    - "бол(ен|ьна|ьной|ьные|еешь|еть|еем)"
    - "симптом.*"
    - "синдром.*"
    - "депресс.*"
    - "тревог.*"
    - "тревожн.*"
    - "выгора.*"
    - "бессонниц.*"
    - "анеми.*"
