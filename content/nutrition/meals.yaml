# Meal library (блюда и тарелки) — layer 6 of the configurator (A41 §7). Schema: SCHEMA.md §3.
# `components` reference components.yaml; `n` = hand portions for the «рабочая» (moderate) plate.
# The engine rescales starch/fruit by the plate of the day (templates.yaml → plates) and never touches safety.
# `allergens`, `may_contain`, `diets` are DECLARED for people to read; check_nutrition.py derives them from
# components and fails on any mismatch, so a typo can never hide an allergen.
# Ids are stable forever: never renumber or reuse; retire with `retired: true`.
# Brands appear only as examples of places (A19 §7, Agent 7), never as advertising.
version: 1
reviewedBy: []
status: draft

# Closed lists for meals (check_nutrition.py validates against them).
contexts: [home, office, restaurant, fastfood, travel, airport, gym, outdoor]
meal_tags: [quick, no_time, weekend, meal_prep, plant, russian_classic, us, mediterranean, fermented, fiber, omega3, lean,
            soft, gentle, sick_day, travel, outside, pantry, fuel, high_load, low_load, tomorrow_long, pre_training,
            during_training, post_training, protein_before_sleep, after_short_sleep]

