  # ------------------------------------------------------------------ stack (accounting only)
  - id: STK-01
    version: 1
    title_ru: "Кофеин в стеке и кофейный рубеж"
    domain: stack
    stage: schedule
    priority: 380
    when:
      any:
        - {fact: stack.caffeinated_after_cutoff, op: eq, value: true}
        - {fact: stack.prescribed_stimulant_late, op: eq, value: true}
    then:
      - {do: add_item, domain: stack, content: STACK_NOTE, display: note}
    variants:
      - id: own_choice
        when: {fact: stack.caffeinated_after_cutoff, op: eq, value: true}
        then: [{do: set_param, key: stack_hint, value: move_before_cutoff}]
        why_ru: "«{item}» ты отметил как содержащий кофеин, а он стоит после {caffeine_cutoff}. Если это твой выбор, а не назначение врача, его можно перенести раньше. Чем больше кофеина в продукте, тем раньше стоит его принимать."
      - id: prescribed
        when: {fact: stack.prescribed_stimulant_late, op: eq, value: true}
        then: [{do: set_param, key: stack_hint, value: ask_doctor_only}]
        why_ru: "«{item}» назначен врачом — его время и дозу я не трогаю. Если сон страдает, это вопрос к врачу; могу добавить его в список вопросов к визиту."
    user_override: any
    why_ru: "{variant_why}"
    evidence:
      level: A
      kind: fact
      sources: ["Gardiner 2023, Sleep Med Rev (кофеин и сон, метаанализ; требует проверки выходных данных)"]
      note_ru: "Только учёт и время; дозы не называем и не меняем (вето A19 §7, A26 §3)."
    contraindications_ru: ["Назначенное врачом не меняем никогда"]
    red_flags_ru: ["Сердцебиение, тревога, бессонница на фоне стимуляторов → к врачу"]
    review: [agent-3, agent-7]
