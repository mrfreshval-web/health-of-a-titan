    why_ru: "Третий бережный день подряд — похоже, нагрузка накопилась. Предлагаю лёгкую неделю: тренировки легче на ~40 %, без интервалов, вечера без работы. Это часть тренировки, а не откат."
    evidence:
      level: A
      kind: fact
      sources: ["Meeusen 2013, MSSE 45(1), консенсус ECSS/ACSM (A04 #21)", "A19 TR-01"]
      note_ru: "Консенсус о снижении нагрузки при признаках перегрузки — A; конкретные «3 дня» и «−40 %» — [Оценка] D."
    contraindications_ru: []
    red_flags_ru: ["Если и в лёгкую неделю самочувствие не возвращается — SAF-05"]
