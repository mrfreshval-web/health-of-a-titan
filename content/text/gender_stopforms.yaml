# content/text/gender_stopforms.yaml — ведёт Агент 16, ревью 10
version: 1
reviewedBy: [agent-16, agent-10]   # обязательный заголовок content/ (common.schema.json); ревью 2026-11-07
# Всегда запрещено в n (и в why_ru / title_ru / ru / what_ru / anchor YAML).
phrases:            # ищутся как подстрока, без учёта регистра
  - "ты отметил"     # и «ты отметила» — через forms ниже
  - "ты заметил"
  - "ты назвал"
  - "ты сделал"
  - "ты выбрал"
  - "ты был"
  - "тебе самому"
  - "тебе самой"
  - "сам с собой"
  - "сама с собой"
forms:              # целые слова; каждая пара — м / ж
  - [отметил, отметила]
  - [заметил, заметила]
  - [назвал, назвала]
  - [сделал, сделала]
  - [изменил, изменила]
  - [выбрал, выбрала]
  - [пропустил, пропустила]
  - [вернулся, вернулась]
  - [справился, справилась]
  - [выспался, выспалась]
  - [разогнался, разогналась]
  - [поел, поела]
  - [болел, болела]
  - [простыл, простыла]
  - [простужен, простужена]
  - [устал, устала]
  - [голоден, голодна]
  - [согласен, согласна]
  - [уверен, уверена]
  - [готов, готова]      # «готово» и «приготовься» не попадают: целое слово
  - [должен, должна]     # уже в banned A39
  - [доволен, довольна]
  - [один, одна]         # только в phrases-режиме «ты один» / «ты одна»: как слово даёт ложные срабатывания
# Ключи с голосом Винса (D-017), исключаются целиком:
voice_allow:
  - DayTexts.RETURN_WHY
  - DayTexts.RETURN_HEADLINE
  - return.yaml:RET-*.why_ru
  - WeekCopy.GOAL_AUTO
  - CheckinTexts.lines/BUTLER/*      # «Я всё подготовил…»
  - PersonaTexts.*                   # превью-реплики наставников
  - TodayTexts.sync*                 # «обновлю сам»
  - WhoopTexts.*                     # «повторю сам», «WHOOP досчитал»
