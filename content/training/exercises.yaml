    level: classic
    category: mobility
    pattern: mobility_hip
    muscles: {primary: [glutes, hip_flexors], secondary: [adductors]}
    equipment: [mat]
    place: [home, gym, hotel]
    measure: time_per_side
    impact: low
    risk_tags: []
    default: {sets: 1, time_s: 45}
    technique_ru:
      - "Сядь: передняя нога согнута под 90° перед тобой, задняя — под 90° сбоку."
      - "Выпрями спину и мягко наклонись грудью к передней голени."
      - "Перекинь колени на другую сторону без помощи рук, если получается."
    mistakes_ru: ["Круглая спина вместо наклона от таза", "Боль в колене — сигнал уменьшить угол"]
    cues_ru: ["Грудь к голени, а не нос к колену", "Опирайся руками, если нужно"]
    breathing_ru: "Спокойное дыхание, на выдохе чуть глубже."
    contraindications: [knee_pain, hip_pain]
    regressions: []
    progressions: [ex-stretch-pigeon]
    swaps: [ex-worlds-greatest]
    animation:
      view: front
      loop: false
      props: [mat]
      poses:
        - {key: sit, ru: "Сидя, обе ноги согнуты под прямым углом, спина вертикально"}
        - {key: lean, ru: "Наклон грудью к передней голени от таза"}
        - {key: switch, ru: "Колени перекинуты на другую сторону"}

