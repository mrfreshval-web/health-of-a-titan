# Exercise library for the training system (A40 §5, content/training/SCHEMA.md).
# ids are stable forever: never renumber, never reuse; to retire an exercise set `retired: true`.
# level = the lowest level where the exercise may appear (classic < advanced < extreme).
# contraindications = profile codes (A40 §8 «Профиль», shared with content/profile/ from A41).
# risk_tags = properties of the movement; rules.yaml maps day flags and profile codes to forbidden tags.
# animation.poses = key poses in words; the TitanPose keyframes (A40 §5.3) are produced later.
# Technique texts: Agent 12. Contraindications and safety wording: review by Agent 3 (CLAUDE.md).
# Validate: python3 content/training/scripts/check_training.py
version: 1
reviewedBy: []   # draft: Agent 12 with in-session review of Agent 3 (A40 §11); final review pending
status: draft

exercises:

  # =====================================================================
  # MOBILITY, STRETCHING, BREATHING — used in every warm-up and cool-down
  # =====================================================================

  - id: ex-cat-cow
    name_ru: "Кошка — корова"
    name_en: "Cat-cow"
    a19: E30
    level: classic
    category: mobility
    pattern: mobility_spine
    muscles: {primary: [spine], secondary: [core]}
    equipment: [mat]
    place: [home, gym, outdoor, hotel]
    measure: reps
    impact: low
    risk_tags: []
    default: {sets: 1, reps: "8", tempo: "3-1-3-1"}
    technique_ru:
      - "Встань на четвереньки: ладони под плечами, колени под тазом."
      - "На выдохе округли спину, подбородок к груди, пупок к позвоночнику."
      - "На вдохе плавно прогнись, грудь вперёд, взгляд чуть вверх."
    mistakes_ru: ["Двигается только шея, а грудной отдел стоит", "Резкий прогиб в пояснице в конце"]
    cues_ru: ["Двигайся позвонок за позвонком", "Дыхание ведёт движение"]
    breathing_ru: "Выдох — округление, вдох — прогиб."
    contraindications: [wrist_pain]
    regressions: []
    progressions: [ex-worlds-greatest]
    swaps: [ex-open-book]
    animation:
      view: side
      loop: true
      props: [mat]
      poses:
        - {key: neutral, ru: "Четвереньки, спина ровная, как стол"}
        - {key: cat, ru: "Спина круглая дугой вверх, голова опущена"}
        - {key: cow, ru: "Спина прогнута, грудь вперёд, взгляд вперёд-вверх"}

  - id: ex-worlds-greatest
    name_ru: "Выпад с разворотом («лучшая растяжка»)"
    name_en: "World's greatest stretch"
    level: classic
    category: mobility
    pattern: mobility_hip
    muscles: {primary: [hip_flexors, spine], secondary: [hamstrings, adductors, upper_back]}
    equipment: [none]
    place: [home, gym, outdoor, hotel]
    measure: reps_per_side
    impact: low
    risk_tags: []
    default: {sets: 1, reps: "4", tempo: "2-2-2-0"}
    technique_ru:
      - "Сделай длинный выпад вперёд правой ногой, левая рука на полу у стопы."
      - "Опусти правый локоть к внутренней стороне стопы, задержись на выдохе."
      - "Разверни корпус и подними правую руку к потолку, взгляд за рукой."
    mistakes_ru: ["Заднее колено согнуто и таз проваливается", "Разворот идёт поясницей, а не грудью"]
    cues_ru: ["Задняя нога — длинная пружина", "Раскрывай грудь, как книгу"]
    breathing_ru: "Выдох — к стопе, вдох — разворот вверх."
    contraindications: [knee_pain, hip_pain]
    regressions: [ex-stretch-hip-flexor]
    progressions: []
    swaps: [ex-hip-90-90]
    animation:
      view: three_quarter
      loop: true
      props: []
      poses:
        - {key: lunge, ru: "Длинный выпад, рука у передней стопы, задняя нога прямая"}
        - {key: elbow_down, ru: "Локоть опущен к внутренней стороне передней стопы"}
        - {key: reach_up, ru: "Корпус развёрнут, рука вертикально вверх, взгляд за ней"}

  - id: ex-hip-90-90
