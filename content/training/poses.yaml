# TitanPose keyframes (A40 §6.2–6.3): the skeleton of the Titan in Compose, «линия света».
# One entry per exercise of exercises.yaml; frame keys = animation.poses[].key of that exercise.
# Convention (same as docs/design/training/src/pose.js and TitanPose.kt):
#   100 × 100 box, y grows down, floor at y = 92; the figure faces right in the side view;
#   root = hip [x, y]; every angle is ABSOLUTE, in degrees, clockwise from «up»
#   (0 = up, 90 = forward, 180 = down, 270 = back);
#   12 joints: torso, head, arm_n [upper arm, forearm], arm_f, leg_n [thigh, shin, foot], leg_f;
#   n = near side (bright), f = far side (dim); spine = optional bend of the back (+ arch, − sag).
#   Front view (animation.view: front | top): n limbs hang from the right shoulder and hip.
# Exercises without keyframes show the Titan in a calm standing pose (A40 §12).
# Angles: draft by Agent 13 for the first slice; Agent 4 sets them in the pose editor, Agent 12
# checks every pose by screenshot (A40 §6.3). Validate: python3 content/training/scripts/check_training.py
